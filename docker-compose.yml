services:
  context-still-db:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: context-still-db
    restart: unless-stopped
    ports:
      - '127.0.0.1:7889:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: context_still
    volumes:
      - context_still_pgdata:/var/lib/postgresql/data
    command:
      - 'postgres'
      - '-c'
      - 'shared_buffers=256MB'
      - '-c'
      - 'work_mem=16MB'
      - '-c'
      - 'maintenance_work_mem=128MB'
      - '-c'
      - 'max_connections=80'

volumes:
  context_still_pgdata:
