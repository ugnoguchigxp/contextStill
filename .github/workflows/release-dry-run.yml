name: release-dry-run
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate tag matching package and Cargo versions
        required: true
        type: string
permissions:
  contents: read
jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: bun install --frozen-lockfile
      - run: bun run verify:fast
      - run: cargo test --locked --workspace -- --test-threads=2
      - run: bun run test:sqlite-all
      - run: bun run verify:onboarding
      - run: bun run verify:compile-parity
      - name: Build the recorded upgrade baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/context-still-baseline" ff7703244547f323c9bf31e6d4d7f38ef4e2f3af
          cargo build --locked --manifest-path "$RUNNER_TEMP/context-still-baseline/Cargo.toml" --target-dir "$RUNNER_TEMP/context-still-baseline/target" -p context-stilld
      - name: Rehearse update and supported backup recovery
        run: bun run verify:update "$RUNNER_TEMP/context-still-baseline/target/debug/context-stilld"
      - name: Build candidate without publishing
        env:
          CONTEXT_STILL_RELEASE_TAG: ${{ inputs.tag }}
        run: bun scripts/release-dry-run.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run
          path: |
            artifacts/release/
            spec/docs/assets/validated-improvements-2026-09-12/update-rehearsal.json
            spec/docs/assets/validated-improvements-2026-09-12/compile-parity.json
          if-no-files-found: error
